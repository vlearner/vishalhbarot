<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates - Vishal Barot</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --heading-color: #1a1a1a;
            --card-bg: #fff;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --card-shadow-hover: rgba(0, 0, 0, 0.15);
            --meta-color: #666;
            --issuer-color: #0066cc;
            --toggle-bg: #fff;
            --toggle-shadow: rgba(0, 0, 0, 0.2);
        }
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --heading-color: #f0f0f0;
            --card-bg: #2d2d44;
            --card-shadow: rgba(0, 0, 0, 0.3);
            --card-shadow-hover: rgba(0, 0, 0, 0.4);
            --meta-color: #b0b0b0;
            --issuer-color: #4da3ff;
            --toggle-bg: #2d2d44;
            --toggle-shadow: rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 80px 20px 40px 20px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            color: var(--heading-color);
            transition: color 0.4s ease;
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .certificate-block {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.4s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .certificate-block:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px var(--card-shadow-hover);
        }

        .course-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--heading-color);
            margin-bottom: 12px;
            line-height: 1.3;
            transition: color 0.4s ease;
        }

        .certificate-meta {
            font-size: 0.95rem;
            color: var(--meta-color);
            transition: color 0.4s ease;
        }

        .issuer {
            font-weight: 500;
            color: var(--issuer-color);
            transition: color 0.4s ease;
        }

        .date {
            margin-top: 4px;
        }

        /* Navigation bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            gap: 20px;
            z-index: 1000;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.85;
            transition: opacity 0.3s ease, color 0.4s ease;
        }
        .nav-links a:hover {
            opacity: 1;
        }
        /* Theme toggle button */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: var(--toggle-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--toggle-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.4s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px var(--toggle-shadow);
        }
        .theme-toggle:focus-visible {
            outline: 3px solid var(--issuer-color);
            outline-offset: 3px;
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            transition: transform 0.4s ease, opacity 0.3s ease;
        }
        .theme-toggle .sun-icon {
            display: none;
            color: #f39c12;
        }
        .theme-toggle .moon-icon {
            display: block;
            color: #667eea;
        }
        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }
        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }
        .theme-toggle:active svg {
            transform: rotate(30deg);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .course-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-links">

        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">

            </svg>
        </button>
    </nav>

    <div class="container">

    <script>
        (function() {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            
            // Helper function to safely access localStorage
            function getStoredTheme() {
                try {
                    return localStorage.getItem('theme');
                } catch (e) {
                    return null;
                }
            }
            
            function setStoredTheme(theme) {
                try {
                    localStorage.setItem('theme', theme);
                } catch (e) {
                    // localStorage not available, ignore
                }
            }
            
            // Check for saved theme preference or default to light
            const savedTheme = getStoredTheme() || 'light';
            if (savedTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            }
            
            // Update aria-label based on current theme
            function updateAriaLabel() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            }
            
            // Initialize aria-label
            updateAriaLabel();
            
            // Toggle theme on button click
            themeToggle.addEventListener('click', function() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    html.removeAttribute('data-theme');
                    setStoredTheme('light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    setStoredTheme('dark');
                }
                
                updateAriaLabel();
            });
        })();
    </script>
</body>
</html>
