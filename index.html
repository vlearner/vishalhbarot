<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Barot - 2025 Website</title>
    <style>
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-color: #fff;
            --text-opacity: 0.9;
            --social-bg: #fff;
            --social-shadow: rgba(0, 0, 0, 0.2);
        }
        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --text-color: #e0e0e0;
            --text-opacity: 0.85;
            --social-bg: #2d2d44;
            --social-shadow: rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            transition: background 0.4s ease, color 0.4s ease;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            transition: color 0.4s ease;
        }
        p {
            font-size: 1.25rem;
            opacity: var(--text-opacity);
            margin-bottom: 2rem;
            transition: opacity 0.4s ease;
        }
        .social-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--social-bg);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.4s ease;
        }
        .social-links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px var(--social-shadow);
        }
        .social-links svg {
            width: 28px;
            height: 28px;
        }
        /* Navigation bar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            gap: 20px;
            z-index: 1000;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.3s ease, color 0.4s ease;
        }
        .nav-links a:hover {
            opacity: 1;
        }
        /* Theme toggle button */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: var(--social-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--social-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.4s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px var(--social-shadow);
        }
        .theme-toggle:focus-visible {
            outline: 3px solid var(--text-color);
            outline-offset: 3px;
        }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            transition: transform 0.4s ease, opacity 0.3s ease;
        }
        .theme-toggle .sun-icon {
            display: none;
            color: #f39c12;
        }
        .theme-toggle .moon-icon {
            display: block;
            color: #667eea;
        }
        [data-theme="dark"] .theme-toggle .sun-icon {
            display: block;
        }
        [data-theme="dark"] .theme-toggle .moon-icon {
            display: none;
        }
        .theme-toggle:active svg {
            transform: rotate(30deg);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">About</a>
            <a href="certificates.html">Certificates</a>
            <a href="tours.html">Tours</a>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">
            <!-- Moon icon - shown in light mode (click to go dark) -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
            </svg>
            <!-- Sun icon - shown in dark mode (click to go light) -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>
            </svg>
        </button>
    </nav>
    
    <div class="container">
        <h1>Welcome</h1>
        <p>Vishal Barot's 2025 Website</p>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/vishalhbarot/" target="_blank" rel="noopener noreferrer" aria-label="Connect on LinkedIn" title="Connect on LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img">
                    <title>LinkedIn</title>
                    <path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
            </a>
        </div>
    </div>

    <script>
        (function() {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            
            // Helper function to safely access localStorage
            function getStoredTheme() {
                try {
                    return localStorage.getItem('theme');
                } catch (e) {
                    return null;
                }
            }
            
            function setStoredTheme(theme) {
                try {
                    localStorage.setItem('theme', theme);
                } catch (e) {
                    // localStorage not available, ignore
                }
            }
            
            // Check for saved theme preference or default to light
            const savedTheme = getStoredTheme() || 'light';
            if (savedTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            }
            
            // Update aria-label based on current theme
            function updateAriaLabel() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            }
            
            // Initialize aria-label
            updateAriaLabel();
            
            // Toggle theme on button click
            themeToggle.addEventListener('click', function() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                
                if (isDark) {
                    html.removeAttribute('data-theme');
                    setStoredTheme('light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    setStoredTheme('dark');
                }
                
                updateAriaLabel();
            });
        })();
    </script>
</body>
</html>
